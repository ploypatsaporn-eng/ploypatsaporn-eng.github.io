<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bakery & Ice Cream Match</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Fonts: Fredoka & Prompt -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Prompt:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      box-sizing: border-box;
    }

    body {
      font-family: 'Prompt', 'Fredoka', sans-serif;
      /* Pastel Pink Smooth Gradient matching reference theme */
      background: linear-gradient(180deg, #F9C5D1 0%, #F8B4C4 50%, #F5A5B8 100%);
      min-height: 100vh;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
      position: relative;
    }

    /* Ambient floating sparkle particles background */
    .sparkle-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #ffffff 100%, transparent),
        radial-gradient(3px 3px at 80px 120px, rgba(255, 255, 255, 0.8) 100%, transparent),
        radial-gradient(2px 2px at 150px 70px, #ffffff 100%, transparent),
        radial-gradient(3px 3px at 240px 180px, rgba(255, 255, 255, 0.6) 100%, transparent),
        radial-gradient(2px 2px at 310px 90px, #ffffff 100%, transparent),
        radial-gradient(3px 3px at 380px 240px, rgba(255, 255, 255, 0.9) 100%, transparent);
      background-repeat: repeat;
      background-size: 400px 300px;
      opacity: 0.6;
    }

    .font-sweet {
      font-family: 'Fredoka', 'Prompt', sans-serif;
    }

    /* Top HUD Cards */
    .hud-pill {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 6px 14px;
      box-shadow: 0 4px 12px rgba(225, 112, 137, 0.18);
      border: 2px solid #FCE4EC;
    }

    /* Board Frame */
    .board-container-outer {
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(8px);
      border-radius: 28px;
      border: 4px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 12px 32px rgba(214, 82, 110, 0.25);
    }

    /* Tile Slot Styling */
    .tile-slot {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      background: #F8B3C3;
      border-radius: 12px;
      border: 1.5px solid rgba(255, 255, 255, 0.5);
      transition: background 0.2s;
    }

    .tile-slot:nth-child(even) {
      background: #F7ABC1;
    }

    .dessert-item {
      position: relative;
      width: 90%;
      height: 90%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: transform 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .dessert-item svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 3px 6px rgba(180, 60, 80, 0.32));
    }

    /* Selection Highlight Animation */
    .tile-selected {
      background: #F472B6 !important;
      border-color: #FFFFFF !important;
    }

    .tile-selected .dessert-item {
      transform: scale(1.18);
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.95));
      animation: pulse-select 0.6s infinite alternate ease-in-out;
    }

    @keyframes pulse-select {
      0% { transform: scale(1.12); }
      100% { transform: scale(1.24); }
    }

    /* Pop Burst Animation */
    .tile-pop {
      animation: pop-anim 0.22s forwards ease-in;
    }

    @keyframes pop-anim {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35) rotate(10deg); opacity: 0.8; }
      100% { transform: scale(0); opacity: 0; }
    }

    /* Special Rainbow Item Animation */
    .special-star {
      animation: star-rotate 2.5s infinite linear;
    }

    @keyframes star-rotate {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.1); }
      100% { transform: rotate(360deg) scale(1); }
    }

    /* Floating Score & Combo Banners */
    .score-float {
      position: absolute;
      font-family: 'Fredoka', 'Prompt', sans-serif;
      font-weight: 700;
      color: #D81B60;
      pointer-events: none;
      animation: float-up 0.8s forwards ease-out;
      z-index: 60;
      text-shadow: 0 2px 4px rgba(255, 255, 255, 0.95);
    }

    @keyframes float-up {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      50% { transform: translateY(-18px) scale(1.2); }
      100% { opacity: 0; transform: translateY(-36px) scale(0.9); }
    }

    .combo-banner {
      position: absolute;
      pointer-events: none;
      font-family: 'Fredoka', 'Prompt', sans-serif;
      font-weight: 700;
      color: #C2185B;
      background: #FFFFFF;
      padding: 0.4rem 1.4rem;
      border-radius: 9999px;
      border: 3px solid #F06292;
      box-shadow: 0 8px 24px rgba(194, 24, 91, 0.3);
      animation: combo-bounce 0.9s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 70;
    }

    @keyframes combo-bounce {
      0% { opacity: 0; transform: scale(0.3) rotate(-6deg); }
      30% { opacity: 1; transform: scale(1.15) rotate(2deg); }
      70% { opacity: 1; transform: scale(1) rotate(-1deg); }
      100% { opacity: 0; transform: scale(0.8) translateY(-25px); }
    }

    /* Burst Particles */
    .particle {
      position: absolute;
      pointer-events: none;
      border-radius: 50%;
      animation: particle-burst 0.5s ease-out forwards;
      z-index: 50;
    }

    @keyframes particle-burst {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.2); }
    }

    /* Grid Layout */
    #game-board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      gap: 3px;
      touch-action: none;
    }

    /* Action Buttons (Cyan & Soft Pink gradient) */
    .btn-circle-cyan {
      background: linear-gradient(135deg, #70E0F6 0%, #38BDF8 100%);
      color: #FFFFFF;
      box-shadow: 0 4px 10px rgba(56, 189, 248, 0.35);
      border: 2px solid #FFFFFF;
    }

    .btn-circle-pink {
      background: linear-gradient(135deg, #FF8DA1 0%, #F43F5E 100%);
      color: #FFFFFF;
      box-shadow: 0 4px 10px rgba(244, 63, 94, 0.35);
      border: 2px solid #FFFFFF;
    }

    .progress-bar-fill {
      background: linear-gradient(90deg, #70E0F6 0%, #38BDF8 50%, #4ADE80 100%);
    }
  </style>
</head>

<body class="flex flex-col items-center justify-between min-h-screen p-3 relative select-none">

      <!-- Target Progress Summary Indicator at Bottom -->

        <span class="text-xs font-bold text-pink-800">Target:</span>

  <!-- Settings & Pause Modal -->

  <script>
    const AudioEngine = {
      ctx: null,
      enabled: true,

      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },

      play(type, combo = 1) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        if (type === 'swap') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(360, now);
          osc.frequency.exponentialRampToValueAtTime(620, now + 0.08);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'pop') {
          osc.type = 'triangle';
          const freq = 500 + Math.min(combo * 100, 600);
          osc.frequency.setValueAtTime(freq, now);
          osc.frequency.exponentialRampToValueAtTime(freq * 1.3, now + 0.1);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          osc.start(now);
          osc.stop(now + 0.1);
        } else if (type === 'win') {
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
            const o = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            o.connect(g);
            g.connect(this.ctx.destination);
            o.frequency.setValueAtTime(freq, now + idx * 0.09);
            g.gain.setValueAtTime(0.18, now + idx * 0.09);
            g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.09 + 0.2);
            o.start(now + idx * 0.09);
            o.stop(now + idx * 0.09 + 0.2);
          });
        } else if (type === 'lose') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.linearRampToValueAtTime(120, now + 0.35);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        }
      }
    };

    const BOARD_SIZE = 8;

    const DESSERT_ITEMS = [

          <path d="M32 10 C25 10 21 16 24 22 C19 21 14 25 16 31 C12 33 13 39 19 39 L45 39 C51 39 52 33 48 31 C50 25 45 21 40 22 C43 16 39 10 32 10 Z" fill="#F472B6"/>
          <circle cx="32" cy="10" r="4" fill="#E11D48"/>

      {
        /* Distinct Pearl White Stem Glass Ice Cream Sundae */
        id: 'icecream_sundae',
        svg: `<svg viewBox="0 0 64 64" fill="none">
          <!-- Glossy Pearl White Ceramic Sundae Cup Base & Stem -->
          <ellipse cx="32" cy="60" rx="12" ry="3" fill="#E2E8F0"/>

          <!-- Dual Ice Cream Scoops -->

          <path d="M22 25 C18 25 16 20 22 16 C26 16 30 20 30 25 Z" fill="#F472B6"/>

          <!-- Wafer Stick -->
          <rect x="39" y="8" width="4" height="24" rx="2" transform="rotate(18 39 8)" fill="#D97706"/>
          <path d="M41 10 L43 12 M42 15 L44 17 M43 20 L45 22" stroke="#FEF08A" stroke-width="1.2"/>
          <!-- Whipped Cream Swirl & Cherry -->
          <circle cx="32" cy="7" r="4.5" fill="#881337"/>
          <circle cx="30.5" cy="5.5" r="1" fill="#FFFFFF"/>
          <path d="M32 3 C34 1 37 2 39 4" stroke="#451A03" stroke-width="1.2" stroke-linecap="round"/>
        </svg>`
      }
    ];

    const GameApp = {
      board: [],
      selectedTile: null,
      isProcessing: false,
      score: 0,
      level: 1,
      movesLeft: 20,
      targetScore: 1200,
      boostersLeft: 2,
      comboMultiplier: 1,

      touchStartX: 0,
      touchStartY: 0,
      touchTile: null,

      init() {
        this.score = 0;
        this.movesLeft = 20;
        this.targetScore = 1200;
        this.boostersLeft = 2;
        this.comboMultiplier = 1;

        this.updateUI();

        do {
          this.generateBoard();
        } while (this.checkMatches().hasMatches || !this.hasValidMoves());

        this.renderBoard();
      },

      generateBoard() {
        this.board = [];
        for (let r = 0; r < BOARD_SIZE; r++) {
          this.board[r] = [];
          for (let c = 0; c < BOARD_SIZE; c++) {
            this.board[r][c] = this.getRandomDessert();
          }
        }
      },

      getRandomDessert() {
        const item = DESSERT_ITEMS[Math.floor(Math.random() * DESSERT_ITEMS.length)];
        return {
          id: item.id,
          svg: item.svg,
          special: null
        };
      },

      renderBoard() {
        const boardElem = document.getElementById('game-board');
        boardElem.innerHTML = '';

        for (let r = 0; r < BOARD_SIZE; r++) {
          for (let c = 0; c < BOARD_SIZE; c++) {
            const slot = document.createElement('div');
            slot.className = 'tile-slot';
            slot.dataset.row = r;
            slot.dataset.col = c;

            const item = this.board[r][c];
            if (item) {
              const itemElem = document.createElement('div');
              let specialClass = item.special === 'star' ? 'special-star' : '';
              itemElem.className = `dessert-item ${specialClass}`;

              if (this.selectedTile && this.selectedTile.r === r && this.selectedTile.c === c) {
                slot.classList.add('tile-selected');
              }

              itemElem.innerHTML = item.svg;
              slot.appendChild(itemElem);
            }

            slot.addEventListener('click', () => this.handleTileClick(r, c));
            slot.addEventListener('touchstart', (e) => this.handleTouchStart(e, r, c), { passive: true });
            slot.addEventListener('touchend', (e) => this.handleTouchEnd(e, r, c));

            boardElem.appendChild(slot);
          }
        }
      },

      handleTileClick(r, c) {
        if (this.isProcessing) return;
        AudioEngine.init();

        if (!this.selectedTile) {
          this.selectedTile = { r, c };
          this.renderBoard();
        } else {
          if (this.selectedTile.r === r && this.selectedTile.c === c) {
            this.selectedTile = null;
            this.renderBoard();
          } else if (this.isAdjacent(this.selectedTile, { r, c })) {
            this.attemptSwap(this.selectedTile, { r, c });
            this.selectedTile = null;
          } else {
            this.selectedTile = { r, c };
            this.renderBoard();
          }
        }
      },

      handleTouchStart(e, r, c) {
        if (this.isProcessing) return;
        const touch = e.touches[0];
        this.touchStartX = touch.clientX;
        this.touchStartY = touch.clientY;
        this.touchTile = { r, c };
      },

      handleTouchEnd(e, r, c) {
        if (this.isProcessing || !this.touchTile) return;
        const touch = e.changedTouches[0];
        const diffX = touch.clientX - this.touchStartX;
        const diffY = touch.clientY - this.touchStartY;
        const threshold = 18;

        if (Math.abs(diffX) > threshold || Math.abs(diffY) > threshold) {
          let targetR = r;
          let targetC = c;

          if (Math.abs(diffX) > Math.abs(diffY)) {
            targetC += diffX > 0 ? 1 : -1;
          } else {
            targetR += diffY > 0 ? 1 : -1;
          }

          if (targetR >= 0 && targetR < BOARD_SIZE && targetC >= 0 && targetC < BOARD_SIZE) {
            this.attemptSwap({ r, c }, { r: targetR, c: targetC });
          }
        }
        this.touchTile = null;
      },

      isAdjacent(t1, t2) {
        const dr = Math.abs(t1.r - t2.r);
        const dc = Math.abs(t1.c - t2.c);
        return (dr === 1 && dc === 0) || (dr === 0 && dc === 1);
      },

      async attemptSwap(t1, t2) {
        this.isProcessing = true;
        AudioEngine.play('swap');

        this.swapDesserts(t1, t2);
        this.renderBoard();

        const matchData = this.checkMatches();

        if (!matchData.hasMatches) {
          await this.sleep(200);
          this.swapDesserts(t1, t2);
          this.renderBoard();
          this.isProcessing = false;
        } else {
          this.movesLeft--;
          this.comboMultiplier = 1;
          this.updateUI();
          await this.processMatchesAndCascades();
        }
      },

      swapDesserts(t1, t2) {
        const temp = this.board[t1.r][t1.c];
        this.board[t1.r][t1.c] = this.board[t2.r][t2.c];
        this.board[t2.r][t2.c] = temp;
      },

      checkMatches() {
        const matchedSet = new Set();
        const matchGroups = [];

        // Horizontal Matches
        for (let r = 0; r < BOARD_SIZE; r++) {
          let matchLength = 1;
          for (let c = 0; c < BOARD_SIZE; c++) {
            const next = c < BOARD_SIZE - 1;
            if (next && this.board[r][c] && this.board[r][c+1] && this.board[r][c].id === this.board[r][c+1].id) {
              matchLength++;
            } else {
              if (matchLength >= 3) {
                const group = [];
                for (let i = 0; i < matchLength; i++) {
                  const col = c - i;
                  matchedSet.add(`${r},${col}`);
                  group.push({ r, c: col });
                }
                matchGroups.push({ dir: 'h', length: matchLength, tiles: group, id: this.board[r][c].id });
              }
              matchLength = 1;
            }
          }
        }

        // Vertical Matches
        for (let c = 0; c < BOARD_SIZE; c++) {
          let matchLength = 1;
          for (let r = 0; r < BOARD_SIZE; r++) {
            const next = r < BOARD_SIZE - 1;
            if (next && this.board[r][c] && this.board[r+1][c] && this.board[r][c].id === this.board[r+1][c].id) {
              matchLength++;
            } else {
              if (matchLength >= 3) {
                const group = [];
                for (let i = 0; i < matchLength; i++) {
                  const row = r - i;
                  matchedSet.add(`${row},${c}`);
                  group.push({ r: row, c });
                }
                matchGroups.push({ dir: 'v', length: matchLength, tiles: group, id: this.board[r][c].id });
              }
              matchLength = 1;
            }
          }
        }

        return { hasMatches: matchedSet.size > 0, matchedSet, matchGroups };
      },

      async processMatchesAndCascades() {
        let matchData = this.checkMatches();

        while (matchData.hasMatches) {
          AudioEngine.play('pop', this.comboMultiplier);

          if (this.comboMultiplier === 2) this.showComboBanner("SWEET!");
          if (this.comboMultiplier === 3) this.showComboBanner("DELICIOUS!");
          if (this.comboMultiplier >= 4) this.showComboBanner("DELIGHTFUL!");

          const pointsPerTile = 20 * this.comboMultiplier;
          let totalGained = matchData.matchedSet.size * pointsPerTile;
          this.score += totalGained;
          this.updateUI();

          matchData.matchedSet.forEach(key => {
            const [r, c] = key.split(',').map(Number);
            this.triggerPop(r, c);
            this.spawnSprinkles(r, c);
            this.showFloatingScore(r, c, pointsPerTile);
            this.board[r][c] = null;
          });

          await this.sleep(220);

          this.applyGravity();
          this.renderBoard();
          await this.sleep(150);

          this.refillBoard();
          this.renderBoard();
          await this.sleep(200);

          this.comboMultiplier++;
          matchData = this.checkMatches();
        }

        this.checkGameStatus();

        if (!this.hasValidMoves()) {
          await this.shuffleBoard();
        }

        this.isProcessing = false;
      },

      triggerPop(r, c) {
        const tile = document.querySelector(`[data-row="${r}"][data-col="${c}"] .dessert-item`);
        if (tile) tile.classList.add('tile-pop');
      },

      spawnSprinkles(r, c) {
        const slot = document.querySelector(`[data-row="${r}"][data-col="${c}"]`);
        if (!slot) return;

        const colors = ['#f43f5e', '#ec4899', '#38bdf8', '#facc15', '#4ade80'];
        for (let i = 0; i < 5; i++) {
          const p = document.createElement('div');
          p.className = 'particle';
          const size = Math.random() * 5 + 3;
          p.style.width = `${size}px`;
          p.style.height = `${size}px`;
          p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
          p.style.left = '50%';
          p.style.top = '50%';

          const angle = Math.random() * Math.PI * 2;
          const dist = Math.random() * 24 + 8;
          p.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
          p.style.setProperty('--dy', `${Math.sin(angle) * dist}px`);

          slot.appendChild(p);
          setTimeout(() => p.remove(), 500);
        }
      },

      showFloatingScore(r, c, pts) {
        const tile = document.querySelector(`[data-row="${r}"][data-col="${c}"]`);
        if (!tile) return;
        const pop = document.createElement('div');
        pop.className = 'score-float text-xs sm:text-sm';
        pop.innerText = `+${pts}`;
        tile.appendChild(pop);
        setTimeout(() => pop.remove(), 750);
      },

      showComboBanner(text) {
        const boardContainer = document.getElementById('game-board');
        const banner = document.createElement('div');
        banner.className = 'combo-banner text-lg sm:text-xl font-bold';
        banner.innerText = text;
        banner.style.left = '25%';
        banner.style.top = '40%';
        boardContainer.appendChild(banner);
        setTimeout(() => banner.remove(), 850);
      },

      applyGravity() {
        for (let c = 0; c < BOARD_SIZE; c++) {
          let emptySpot = BOARD_SIZE - 1;
          for (let r = BOARD_SIZE - 1; r >= 0; r--) {
            if (this.board[r][c] !== null) {
              if (r !== emptySpot) {
                this.board[emptySpot][c] = this.board[r][c];
                this.board[r][c] = null;
              }
              emptySpot--;
            }
          }
        }
      },

      refillBoard() {
        for (let r = 0; r < BOARD_SIZE; r++) {
          for (let c = 0; c < BOARD_SIZE; c++) {
            if (this.board[r][c] === null) {
              this.board[r][c] = this.getRandomDessert();
            }
          }
        }
      },

      hasValidMoves() {
        for (let r = 0; r < BOARD_SIZE; r++) {
          for (let c = 0; c < BOARD_SIZE; c++) {
            if (c < BOARD_SIZE - 1) {
              this.swapDesserts({ r, c }, { r, c: c + 1 });
              const match = this.checkMatches();
              this.swapDesserts({ r, c }, { r, c: c + 1 });
              if (match.hasMatches) return true;
            }
            if (r < BOARD_SIZE - 1) {
              this.swapDesserts({ r, c }, { r: r + 1, c });
              const match = this.checkMatches();
              this.swapDesserts({ r, c }, { r: r + 1, c });
              if (match.hasMatches) return true;
            }
          }
        }
        return false;
      },

      async shuffleBoard() {
        const overlay = document.getElementById('board-overlay');
        overlay.classList.remove('hidden');

        await this.sleep(800);
        do {
          this.generateBoard();
        } while (this.checkMatches().hasMatches || !this.hasValidMoves());

        this.renderBoard();
        overlay.classList.add('hidden');
      },

      useBooster() {
        if (this.boostersLeft <= 0 || this.isProcessing) return;
        this.boostersLeft--;
        document.getElementById('booster-count').innerText = this.boostersLeft;

        // Clear 3 random items magic effect
        for (let i = 0; i < 3; i++) {
          const rx = Math.floor(Math.random() * BOARD_SIZE);
          const ry = Math.floor(Math.random() * BOARD_SIZE);
          this.triggerPop(rx, ry);
          this.spawnSprinkles(rx, ry);
          this.board[rx][ry] = null;
        }
        this.score += 150;
        this.updateUI();
        this.processMatchesAndCascades();
      },

      updateUI() {
        document.getElementById('score-val').innerText = this.score;
        document.getElementById('moves-val').innerText = this.movesLeft;
        document.getElementById('target-text').innerText = `${this.score} / ${this.targetScore}`;

        const progress = Math.min(100, (this.score / this.targetScore) * 100);
        document.getElementById('target-bar').style.width = `${progress}%`;
        document.getElementById('bottom-target-bar').style.width = `${progress}%`;
      },

      checkGameStatus() {
        if (this.score >= this.targetScore) {
          AudioEngine.play('win');
          this.showModal(true);
        } else if (this.movesLeft <= 0) {
          AudioEngine.play('lose');
          this.showModal(false);
        }
      },

      showModal(isWin) {
        const modal = document.getElementById('game-modal');
        const icon = document.getElementById('modal-icon');
        const title = document.getElementById('modal-title');
        const desc = document.getElementById('modal-desc');
        const btn = document.getElementById('modal-btn');

        document.getElementById('modal-score').innerText = this.score;
        document.getElementById('modal-target').innerText = this.targetScore;

        if (isWin) {
          icon.innerHTML = '🍨';
          title.innerText = 'ผ่านด่านแล้ว!';
          desc.innerText = 'เก่งมาก! คุณจับคู่ขนมหวานครบตามเป้าหมายแล้ว!';
          btn.innerText = 'ด่านต่อไป 🚀';
        } else {
          icon.innerHTML = '💔';
          title.innerText = 'จำนวน Move หมดแล้ว!';
          desc.innerText = 'อีกนิดเดียวเท่านั้น! ลองเล่นใหม่อีกครั้งนะ!';
          btn.innerText = 'ลองใหม่ 🔄';
        }

        modal.classList.remove('hidden');
      },

      nextLevelOrRetry() {
        document.getElementById('game-modal').classList.add('hidden');
        if (this.score >= this.targetScore) {
          this.level++;
        }
        this.init();
      },

      openSettings() {
        document.getElementById('settings-modal').classList.remove('hidden');
      },

      closeSettings() {
        document.getElementById('settings-modal').classList.add('hidden');
      },

      openMenu() {
        this.openSettings();
      },

      restartGame() {
        this.closeSettings();
        this.init();
      },

      toggleSound() {
        AudioEngine.enabled = !AudioEngine.enabled;
        const icon = document.getElementById('sound-icon');
        if (AudioEngine.enabled) {
          icon.className = 'fa-solid fa-volume-high text-pink-500 text-lg';
        } else {
          icon.className = 'fa-solid fa-volume-xmark text-pink-300 text-lg';
        }
      },

      sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      }
    };

    window.onload = function() {
      GameApp.init();
    };
  </script>
